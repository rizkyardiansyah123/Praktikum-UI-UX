<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prakir STT NF</title>
</head>
<body>
    <h1>Harga Parkir STT NF</h1>

    <label for="in">Jam Masuk</label>
    <input type="number" id="in">
    <br>

    <label for="out">Jam Keluar</label>
    <input type="number" id="out">
    <br>

    <span id="durasi"></span>
    <br>
    <span id="hasil"></span>
    <br>

    <button type="button" onclick="hitung_parkir()">Hitung</button>

    <script>
        function hitung_parkir() {
            let jam_masuk = Number(document.getElementById("in").value);
            let jam_keluar = Number(document.getElementById("out").value);

            let durasi = jam_keluar - jam_masuk;

            if (durasi <= 0) {
                document.getElementById("durasi").innerHTML = "Durasi tidak valid!";
                document.getElementById("hasil").innerHTML = "";
                return;
            }

            let tarif_awal = 3000;   
            let tarif_per_jam = 1000;

            let selisih_waktu = durasi - 2;
            if (selisih_waktu < 0) selisih_waktu = 0;

            let total = tarif_awal + (selisih_waktu * tarif_per_jam);

            document.getElementById("durasi").innerHTML =
                "Durasi = " + durasi + " Jam";
            document.getElementById("hasil").innerHTML =
                "Total = Rp. " + total.toLocaleString();
        }
    </script>

</body>
</html>
